[project]
name = "apco-tps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rito-Uddin", email = "rito.uddin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "regressionlabs",
    "scipy>=1.18.1",
    "torch>=2.15.0",
]

[project.scripts]
apco-tps = "apco_tps:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
regressionlabs = { git = "https://github.com/osigaud/regressionLabs" }
